name: Mirror to Backup Repo

on:
  push:
    branches:
      - dev
      - master

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    # ✅ Corrected condition (no .git, no backtick, lowercase)
    if: github.repository == 'ddlifecoaching/dynamite-lifestyle-delegate-react-native-app'

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Repository Info
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "✅ Running mirror job"

      - name: Setup SSH key for pushing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MetaLogix_Action_Key }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push branch to backup repo
        run: |
          git remote add mirror git@github.com:kimdynamitecopy/dynamite-lifestyle-delegate-react-native-app-backup.git
          git push mirror HEAD:${{ github.ref_name }} --force
